<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Letter preview · GDG ENSIA</title><style>body{margin:0;background:#cfc6b5;color:#171e19;font:14px Arial,sans-serif}header{position:sticky;top:0;padding:18px;background:#15201c;color:#eee5d2;display:flex;gap:14px;flex-wrap:wrap;align-items:center}select,button{font:14px Arial;padding:10px;background:#ede3ce;border:0;color:#15201c;cursor:pointer}a{color:inherit}iframe{display:block;margin:22px auto;background:#eee;border:0;min-height:2000px;width:704px;max-width:100%}label{white-space:nowrap}</style></head><body><header><a href="index.html">Back to archive</a><select id="department" aria-label="Department"></select><button data-w="320">320px</button><button data-w="375">375px</button><button data-w="704">Desktop</button><label><input type="checkbox" id="off"> Images off</label><label><input type="checkbox" id="sample" checked> Sample copy</label><a id="raw" href="emails/events.html">Standalone HTML</a></header><iframe id="frame" title="Acceptance email preview"></iframe><script>
const frame=document.querySelector('#frame'),sel=document.querySelector('#department');
async function show(){const path='emails/'+sel.value+'.html';document.querySelector('#raw').href=path;let h=await(await fetch(path)).text();h=h.replace('<head>','<head><base href="'+location.origin+location.pathname.replace(/[^/]*$/,'')+'">');if(document.querySelector('#sample').checked)h=h.replaceAll('{{first_name}}','Future Builder').replaceAll('{{next_step_text}}','Your team will add the next-step instructions here before sending.').replaceAll('{{next_step_url}}','#preview-only');if(document.querySelector('#off').checked)h=h.replaceAll('<img ','<img hidden style="display:none!important" ');frame.srcdoc=h;frame.onload=()=>{frame.style.height=(frame.contentDocument.documentElement.scrollHeight+20)+'px'}}
fetch('departments.json').then(r=>r.json()).then(ds=>{sel.innerHTML=ds.map(d=>`<option value="${d.slug}">${d.name}</option>`).join('');show()});sel.onchange=show;document.querySelector('#off').onchange=show;document.querySelector('#sample').onchange=show;document.querySelectorAll('button').forEach(b=>b.onclick=()=>{frame.style.width=b.dataset.w+'px';setTimeout(()=>frame.style.height=(frame.contentDocument.documentElement.scrollHeight+20)+'px',200)})
</script></body></html>
